name: Test agent repo

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
      # template must build and pass its own checks
      - run: |
          python .github/scripts/scaffold.py ci-sample --dest "$RUNNER_TEMP" --no-git
          cd "$RUNNER_TEMP/ci-sample" && ./mvnw -q detekt:check
